name: Build and Push Docker Image

# Trigger matrix (code-checkin-and-pr):
#   push → dev           :dev and :sha-<short> (work in progress)
#   push → main          :latest and :sha-<short> (CI-verified pre-release)
#   pull_request → main  build only, nothing pushed (the image build check)
#   release published    :latest, :<semver>, :<major> (production)
#
# Registry: ghcr.io/crzykidd/technitium-sync

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  # Job name `build` is a required status check on main. Don't rename it.
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify release tag matches VERSION
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(tr -d '[:space:]' < VERSION)"
          if [ "$tag" != "$file" ]; then
            echo "ERROR: release tag '${GITHUB_REF_NAME}' does not match VERSION '${file}'"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/crzykidd/technitium-sync
          flavor: latest=false
          tags: |
            type=raw,value=dev,enable=${{ github.event_name == 'push' && github.ref_name == 'dev' }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref_name == 'main' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.event_name == 'push' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}},enable=${{ github.event_name == 'release' }}
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_CHANNEL=${{ github.event_name == 'release' && 'release' || (github.event_name == 'pull_request' && 'pr') || (github.ref_name == 'main' && 'main') || 'dev' }}
