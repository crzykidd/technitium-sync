name: CI

on:
  # Push-only (no pull_request), as in STD. The dev→main PR's required checks
  # are satisfied by the head commit's push run (keep branch protection
  # non-strict). Triggering on both push and pull_request produces duplicate
  # same-named check runs that can leave required checks stuck at "Expected".
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # Pinned to match requirements-dev.txt, so a new ruff release can't turn
      # Lint red on unchanged code. Rules are selected in ruff.toml.
      - run: pip install ruff==0.15.17
      - run: ruff check .

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  config-validate:
    name: Config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install PyYAML==6.0.3
      - name: Validate YAML and JSON files
        run: |
          python3 << 'EOF'
          import glob, json, sys
          import yaml
          errors = []
          yaml_files = ['docker-compose.example.yml'] + sorted(glob.glob('.github/workflows/*.yml'))
          json_files = sorted(glob.glob('tests/fixtures/*.json')) + sorted(glob.glob('.claude/*.json'))
          for f in yaml_files:
              try: yaml.safe_load(open(f).read())
              except Exception as e: errors.append(f'{f}: {e}')
          for f in json_files:
              try: json.load(open(f))
              except Exception as e: errors.append(f'{f}: {e}')
          if errors:
              for e in errors: print(f'FAIL: {e}', file=sys.stderr)
              sys.exit(1)
          print(f'All config files valid ({len(yaml_files) + len(json_files)} checked)')
          EOF

  compose-validate:
    name: Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose -f docker-compose.example.yml config --quiet
