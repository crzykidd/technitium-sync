# Lint config for CI (.github/workflows/ci.yml), the same rule set as STD.
# Rules: pycodestyle errors and warnings (E, W), pyflakes (F), import sorting
# (I), and flake8-bugbear (B). E501 (line length) is ignored. Widen
# deliberately, not by surprise.
target-version = "py311"
line-length = 100

[lint]
select = ["E", "W", "F", "I", "B"]
ignore = ["E501"]
